<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<main class="container">
    <h1>Student Management</h1>

    <section class="form-container">
        <h2>Student details</h2>
        <input id="rollNo" placeholder="Roll No" aria-label="Roll No">
        <input id="name" placeholder="Name" aria-label="Name">
        <input id="age" type="number" placeholder="Age" aria-label="Age">
        <input id="department" placeholder="Department" aria-label="Department">
        <input id="marks" type="number" placeholder="Marks" aria-label="Marks">

        <div class="buttons">
            <button id="submitBtn" type="button" onclick="add()">Add</button>
            <button type="button" onclick="update()">Update</button>
            <button class="cancel" type="button" onclick="clear()">Clear</button>
        </div>
    </section>

    <section class="students-container">
        <div class="header">
            <h2>Students</h2>
            <button type="button" onclick="load()">Refresh</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Department</th>
                    <th>Marks</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="data"></tbody>
        </table>
    </section>
</main>

<script src="/static/script.js"></script>

</body>
</html>
